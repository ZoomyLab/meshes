name: Publish Meshes to GitHub Pages

on:
  workflow_run:
    workflows: ["Build Meshes and Upload to Release"]
    types:
      - completed

  workflow_dispatch:

jobs:
  publish-pages:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get latest release metadata
        id: release
        run: |
          API="https://api.github.com/repos/${{ github.repository }}/releases/latest"
          echo "Fetching: $API"
          JSON=$(curl -s $API)
          echo "$JSON" > latest.json
          
          TAG=$(echo "$JSON" | jq -r .tag_name)
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Prepare docs folder
        run: |
          rm -rf docs
          mkdir -p docs/meshes

      - name: Download assets from latest release
        run: |
          for asset_url in $(jq -r '.assets[].browser_download_url' latest.json); do
            fname=$(basename "$asset_url")
            echo "Downloading $fname"
            curl -L "$asset_url" -o "docs/meshes/$fname"
          done

      - name: Generate structured index.json
        run: |
          python3 - <<'PYEOF'
          import json, os, re

          files = sorted(f for f in os.listdir("docs/meshes") if os.path.isfile(os.path.join("docs/meshes", f)))
          meshes = {}
          SIZE_LABELS = {"coarse", "medium", "fine"}

          for f in files:
              name, dot, ext = f.rpartition(".")
              if not dot:
                  continue

              # Parse: base__size.ext or base.ext
              m = re.match(r"^(.+)__(" + "|".join(SIZE_LABELS) + r")$", name)
              if m:
                  base, size = m.group(1), m.group(2)
              else:
                  base, size = name, None

              if base not in meshes:
                  meshes[base] = {"sizes": set(), "types": set()}
              meshes[base]["types"].add(ext)
              if size:
                  meshes[base]["sizes"].add(size)

          index = {
              "version": 2,
              "files": files,
              "meshes": {
                  k: {"sizes": sorted(v["sizes"]), "types": sorted(v["types"])}
                  for k, v in sorted(meshes.items())
              },
          }

          with open("docs/index.json", "w") as fh:
              json.dump(index, fh, indent=2)
          print(f"index.json: {len(meshes)} meshes, {len(files)} files")
          PYEOF

      - name: Add basic index.html
        run: |
          cat > docs/index.html <<EOF
          <html><body>
          <h1>Meshes</h1>
          <ul>
          $(for f in docs/meshes/*; do echo "<li><a href=\"meshes/$(basename $f)\">$(basename $f)</a></li>"; done)
          </ul>
          </body></html>
          EOF

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy GitHub Pages
        uses: actions/deploy-pages@v4
