name: Build Meshes and Upload to Release

on:
  push:
    paths:
      - "**/*.geo"
      - "blacklist.txt"

  workflow_dispatch:
    inputs:
      full_rebuild:
        description: "Rebuild ALL meshes (ignore git diff)?"
        required: false
        default: "false"
      max_msh_mb:
        description: "Max .msh size in MiB; files above this are skipped"
        required: false
        default: "1024"

jobs:
  build-meshes:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 2

    - name: Fetch all tags
      run: git fetch --tags --force

    - name: Install gmsh
      run: sudo apt-get update && sudo apt-get install -y gmsh

    - name: Determine .geo files to process
      id: changed
      run: |
        echo "Manual full rebuild: '${{ github.event.inputs.full_rebuild }}'"

        if [[ "${{ github.event.inputs.full_rebuild }}" == "true" ]]; then
          CHANGED=$(git ls-files '**/*.geo')
        else
          if git rev-parse HEAD~1 >/dev/null 2>&1; then
            CHANGED=$(git diff --name-only HEAD~1 HEAD -- '**/*.geo')
          else
            CHANGED=$(git ls-files '**/*.geo')
          fi
        fi

        echo "CHANGED FILES:"
        echo "$CHANGED"

        BLACKLIST=$(cat blacklist.txt | tr '\n' ' ')
        echo "BLACKLIST: $BLACKLIST"

        FILTERED=""
        for f in $CHANGED; do
          SKIP=0
          for b in $BLACKLIST; do
            if [[ "$f" == "$b" || "$f" == "$b/"* ]]; then
              SKIP=1
              break
            fi
          done
          [[ $SKIP == 0 ]] && FILTERED="$FILTERED $f"
        done

        echo "FILES TO RUN:"
        echo "$FILTERED"

        echo "files=$FILTERED" >> $GITHUB_OUTPUT

    - name: Run mesh generation (multi-size)
      if: steps.changed.outputs.files != ''
      run: |
        # Don't abort the step on per-directory failures. One broken .geo
        # (e.g. an unmeshable transfinite surface) must not prevent the
        # rest of the catalog from building.
        set +e

        declare -A SIZE_MAP
        SIZE_MAP[coarse]=0.25
        SIZE_MAP[medium]=1
        SIZE_MAP[fine]=4

        # Collect unique directories
        DIRS=""
        for f in ${{ steps.changed.outputs.files }}; do
          DIR=$(dirname "$f")
          if [[ ! " $DIRS " =~ " $DIR " ]]; then
            DIRS="$DIRS $DIR"
          fi
        done

        FAILED_DIRS=""
        for DIR in $DIRS; do
          if [[ ! -f "$DIR/run.sh" ]]; then
            echo "::warning ::No run.sh in '$DIR', skipping."
            continue
          fi

          for SIZE_LABEL in coarse medium fine; do
            FACTOR=${SIZE_MAP[$SIZE_LABEL]}
            echo "=== $DIR | $SIZE_LABEL (factor=$FACTOR) ==="
            (cd "$DIR" && chmod +x run.sh && ./run.sh "$FACTOR")
            RC=$?
            if [[ $RC -ne 0 ]]; then
              echo "::warning ::$DIR failed for size=$SIZE_LABEL (exit $RC); continuing."
              FAILED_DIRS="$FAILED_DIRS $DIR#$SIZE_LABEL"
            fi

            # Rename any outputs that did get produced with size suffix
            for msh in "$DIR"/*.msh; do
              [[ -f "$msh" ]] || continue
              BASE="${msh%.msh}"
              # Skip already-renamed ones from a previous failed size
              if [[ "$msh" == *__coarse.msh || "$msh" == *__medium.msh || "$msh" == *__fine.msh ]]; then
                continue
              fi
              mv "$msh" "${BASE}__${SIZE_LABEL}.msh"
            done
          done

          # Create unsuffixed copies for "medium" (backward compat)
          for msh in "$DIR"/*__medium.msh; do
            [[ -f "$msh" ]] || continue
            COMPAT="${msh//__medium/}"
            cp "$msh" "$COMPAT"
          done
        done

        if [[ -n "$FAILED_DIRS" ]]; then
          echo "::warning ::Some directories failed: $FAILED_DIRS"
        fi
        # Always exit 0 — partial catalog is better than no catalog.
        exit 0

    - name: Generate h5 from msh
      if: steps.changed.outputs.files != ''
      continue-on-error: true
      run: |
        echo "Generating H5 files from MSH using zoomy_jax_standalone..."
        set +e

        docker pull ghcr.io/zoomylab/zoomy_jax_standalone:latest

        docker run --rm \
          -v $PWD:/work \
          -w /work \
          ghcr.io/zoomylab/zoomy_jax_standalone:latest \
          python generate_h5.py
        RC=$?
        if [[ $RC -ne 0 ]]; then
          echo "::warning ::H5 conversion failed (exit $RC). .msh artifacts will still be uploaded."
        fi
        exit 0

    # ---- SEMANTIC VERSIONING ----
    - name: Determine next version
      id: version
      run: |
        LATEST=$(git tag --list "meshes-v*" --sort=-v:refname | head -n 1)
        echo "Latest tag: $LATEST"

        if [[ -z "$LATEST" ]]; then
          NEXT="meshes-v0.1.0"
        else
          BASE=${LATEST#meshes-v}
          IFS='.' read -r MAJ MIN PATCH <<< "$BASE"
          PATCH=$((PATCH+1))
          NEXT="meshes-v$MAJ.$MIN.$PATCH"
        fi

        echo "Next tag: $NEXT"
        echo "tag=$NEXT" >> $GITHUB_OUTPUT

    - name: Create Release
      if: steps.changed.outputs.files != ''
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.version.outputs.tag }}
        name: "Meshes Release ${{ steps.version.outputs.tag }}"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload meshes + geos + h5 with safe naming
      if: steps.changed.outputs.files != ''
      run: |
        TAG=${{ steps.version.outputs.tag }}
        echo "Preparing assets for release $TAG"
    
        mkdir -p release_assets
        shopt -s globstar
        ANY=0
    
        # Read blacklist
        BLACKLIST=$(cat blacklist.txt | tr '\n' ' ')
        echo "BLACKLIST: $BLACKLIST"
    
        # Handle geo, msh, h5
        for EXT in geo msh h5; do
          for f in **/*.$EXT; do
            [[ -f "$f" ]] || continue
            [[ "$f" == .github/* ]] && continue
    
            # Apply blacklist filter
            SKIP=0
            for b in $BLACKLIST; do
              if [[ "$f" == "$b" || "$f" == "$b/"* ]]; then
                SKIP=1
                break
              fi
            done
            [[ $SKIP == 1 ]] && continue
    
            ANY=1
            SAFE_NAME=$(echo "$f" | tr '/' '__')
            OUT="release_assets/$SAFE_NAME"
    
            cp "$f" "$OUT"
            echo "Prepared: $f → $SAFE_NAME"
          done
        done
    
        if [[ $ANY -eq 0 ]]; then
          echo "Nothing to upload."
        else
          # Upload files one by one. Never abort the whole loop on a single
          # failed upload. Two size gates:
          #  * MAX_MB  : practical limit from the workflow input (default 1 GiB)
          #  * HARD    : GitHub's hard 2 GiB-per-asset cap.
          set +e
          MAX_MB=${{ github.event.inputs.max_msh_mb || '1024' }}
          MAX_MB_BYTES=$((MAX_MB * 1024 * 1024))
          HARD=$((2 * 1024 * 1024 * 1024))   # 2 GiB
          FAILED=0
          SKIPPED_PRACTICAL=0
          SKIPPED_HARD=0
          UPLOADED=0
          for f in release_assets/*; do
            SZ=$(stat -c%s "$f" 2>/dev/null || stat -f%z "$f")
            if [[ -n "$SZ" && $SZ -ge $HARD ]]; then
              echo "::warning ::$(basename "$f") is ${SZ} bytes, above GitHub's 2 GiB hard cap — skipping."
              SKIPPED_HARD=$((SKIPPED_HARD + 1))
              continue
            fi
            # Apply the practical cap only to .msh/.h5 artefacts — .geo
            # sources are always small and never trip this.
            if [[ -n "$SZ" && $SZ -ge $MAX_MB_BYTES ]]; then
              case "$f" in
                *.msh|*.h5)
                  echo "::warning ::$(basename "$f") is $((SZ / 1024 / 1024)) MiB (max_msh_mb=$MAX_MB) — skipping."
                  SKIPPED_PRACTICAL=$((SKIPPED_PRACTICAL + 1))
                  continue
                  ;;
              esac
            fi
            echo "Uploading: $f"
            gh release upload "$TAG" "$f" --clobber
            if [[ $? -ne 0 ]]; then
              echo "::warning ::Upload failed for $f; continuing."
              FAILED=$((FAILED + 1))
            else
              UPLOADED=$((UPLOADED + 1))
            fi
          done
          echo "Uploaded: $UPLOADED   Skipped (>${MAX_MB} MiB): $SKIPPED_PRACTICAL   Skipped (>2 GiB hard): $SKIPPED_HARD   Failed: $FAILED"
          exit 0
        fi
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
